{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study ENEM - Login</title>
    <!-- bootstrap apenas para estrutura base, se necessário -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nosso arquivo CSS externo-->
    <link rel="stylesheet" href="{% static "usuarios/style.css" %}">
</head>
<body>
    <div class="auth-card">
        <h3 class="auth-title">Entrar no Study ENEM</h3>
        <form method="POST" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="auth-btn-success">Entrar</button>
        </form>
        <p class="auth-footer">Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
    </div>
</body>
</html>
