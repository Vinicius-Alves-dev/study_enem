{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study ENEM - Cadastro</title>
    <!-- Aqui é o Bootstrap CSS-->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="stylesheet" href="{% static "usuarios/style.css" %}">
</head>
<body>
    <div class="auth-card">
        <h3 class="auth-title">Criar Conta </h3>
        <form method="POST" class="auth-form">
            {% csrf_token %}
            {{form.as_p}}
            <button type="submit" class="auth-btn-primary">Cadastrar</button>
        </form>
        <p class="auth-footer">Já tem uma conta? <a href="{% url "login" %}">Entrar</a></p>
    </div>
</body>
</html>
